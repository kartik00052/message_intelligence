<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Message Intelligence{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="brand">Message Intelligence</span>
      <span class="header-sub">900-message pipeline · sanitized dashboard</span>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>Generated from validated pipeline artifacts · raw sensitive values are never rendered</span>
  </footer>

  <script src="/static/app.js" defer></script>
</body>
</html>
